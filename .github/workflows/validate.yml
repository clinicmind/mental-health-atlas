name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/app.js
      - run: node scripts/test_verified_budget.js

