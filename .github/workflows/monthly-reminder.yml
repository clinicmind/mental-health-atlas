name: Monthly data update reminder

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 scripts/due_sources.py > due.md
          gh issue create --title "Data update due: $(date +%Y-%m)" --body-file due.md
        env:
          GH_TOKEN: ${{ github.token }}
